<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#1A1A2E">
<title>单词本</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,sans-serif;background:#F5F5F5;color:#1A1A2E}
.top{background:#1A1A2E;color:#fff;padding:14px 18px;font-size:18px;font-weight:700;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center}
.top em{font-size:12px;font-weight:400;opacity:.7;font-style:normal}
.bar{display:flex;gap:8px;padding:10px 14px;background:#fff;position:sticky;top:50px;z-index:9;border-bottom:1px solid #eee}
.bar input{flex:1;border:1px solid #ddd;border-radius:20px;padding:10px 14px;font-size:15px;outline:none}
.bar input:focus{border-color:#4A90D9}
.bar button{background:#1A1A2E;color:#fff;border:none;border-radius:20px;padding:10px 22px;font-size:14px;white-space:nowrap}
.load{height:3px;background:#4A90D9;position:sticky;top:100px;z-index:9;display:none}
.load.on{display:block;animation:load 1.5s ease-in-out infinite}
@keyframes load{0%{width:0}50%{width:70%}100%{width:100%}}
.list{max-width:600px;margin:0 auto;padding:10px 14px 80px}
.none{text-align:center;color:#999;padding:80px 20px;font-size:15px;line-height:1.8}
.card{background:#fff;border-radius:10px;padding:14px 16px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card:active{background:#f0f0f0}
.card .o{font-size:17px;font-weight:600;color:#1A1A2E;line-height:1.5;word-break:break-word}
.card .t{font-size:14px;color:#555;margin-top:6px;line-height:1.5;word-break:break-word}
.card .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.card .time{font-size:11px;color:#bbb}
.card .del{background:#C62828;color:#fff;border:none;padding:6px 16px;border-radius:14px;font-size:13px;display:none}
.card.open .del{display:block}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 24px;border-radius:20px;color:#fff;font-size:14px;z-index:100;pointer-events:none;animation:fade 2.2s ease forwards}
@keyframes fade{0%{opacity:0;transform:translateX(-50%) translateY(10px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>

<div class="top"><span>单词本</span><em id="cnt"></em></div>

<div class="bar">
  <input id="inp" type="text" placeholder="输入或粘贴单词 / 短语 / 句子..." enterkeyhint="done">
  <button onclick="doAdd()">保存</button>
</div>

<div class="load" id="load"></div>
<main class="list" id="list"></main>

<script>
// ========== Database ==========
const DB='vdb', ST='w';
let db;
function openDB(){
  return new Promise((resolve,reject)=>{
    const r=indexedDB.open(DB,1);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains(ST)){
        const s=d.createObjectStore(ST,{keyPath:'id',autoIncrement:true});
        s.createIndex('ts','ts',{unique:false});
      }
    };
    r.onsuccess=e=>{db=e.target.result;resolve(db)};
    r.onerror=()=>reject(r.error);
  });
}

function getAll(){
  return new Promise(resolve=>{
    const tx=db.transaction(ST,'readonly');
    const idx=tx.objectStore(ST).index('ts');
    const r=idx.openCursor(null,'prev');
    const a=[];
    r.onsuccess=e=>{const c=e.target.result;c?(a.push(c.value),c.continue()):resolve(a)};
  });
}

function addOne(orig, tran){
  return new Promise(resolve=>{
    const tx=db.transaction(ST,'readwrite');
    tx.objectStore(ST).add({o:orig.trim(),t:tran.trim(),ts:Date.now()});
    tx.oncomplete=()=>resolve();
  });
}

function delOne(id){
  return new Promise(resolve=>{
    const tx=db.transaction(ST,'readwrite');
    tx.objectStore(ST).delete(id);
    tx.oncomplete=()=>resolve();
  });
}

// ========== Translation ==========
function isChinese(s){return /[一-鿿]/.test(s)}

async function translate(text){
  const lp=isChinese(text)?'zh|en':'en|zh-CN';
  const resp=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+lp);
  const json=await resp.json();
  if(json.responseStatus!==200)throw new Error('翻译失败');
  return json.responseData.translatedText;
}

// ========== UI ==========
function toast(msg,ok){
  const el=document.createElement('div');
  el.className='toast';
  el.style.background=ok?'#2E7D32':'#C62828';
  el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2200);
}

function fmt(ts){
  const d=new Date(ts),p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

async function render(){
  const words=await getAll();
  const list=document.getElementById('list'), cnt=document.getElementById('cnt');
  cnt.textContent=words.length?words.length+' 条':'';
  if(!words.length){
    list.innerHTML='<div class="none">还没有单词<br><br>输入或粘贴英语单词 → 点保存</div>';
    return;
  }
  list.innerHTML=words.map(w=>`
    <div class="card" onclick="this.classList.toggle('open')">
      <div class="o">${esc(w.o)}</div>
      <div class="t">${esc(w.t)}</div>
      <div class="row"><span class="time">${fmt(w.ts)}</span><button class="del" onclick="event.stopPropagation();doDel(${w.id})">删除</button></div>
    </div>
  `).join('');
}

async function doDel(id){await delOne(id);await render();toast('已删除',false)}

async function save(text){
  const load=document.getElementById('load');
  load.classList.add('on');
  try{
    const translated=await translate(text);
    await addOne(text,translated);
    await render();
    toast('已保存',true);
  }catch(e){
    toast('翻译失败: '+e.message,false);
  }
  load.classList.remove('on');
}

function doAdd(){
  const inp=document.getElementById('inp');
  const text=inp.value.trim();
  if(!text)return;
  inp.value='';
  save(text);
}

// Enter key
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter')doAdd()});

// ========== Share Target (check URL params) ==========
function checkURL(){
  const s=location.search;
  if(!s)return null;
  const p=new URLSearchParams(s);
  return (p.get('s')||p.get('text')||'').trim()||null;
}

// ========== Service Worker ==========
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js',{scope:location.pathname.replace(/\/[^/]*$/,'/')});
}

// ========== Init ==========
(async function(){
  await openDB();
  await render();

  // Handle shared text from URL
  const shared=checkURL();
  if(shared){
    history.replaceState(null,'',location.pathname);
    save(shared);
  }
})();
</script>

</body>
</html>
